name: Build Android APK

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find /tmp/AgriRoverBuild app/build -type f -name 'app-debug.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK was not found. Build outputs:"
            find /tmp/AgriRoverBuild app/build -maxdepth 8 -type f 2>/dev/null | sort || true
            exit 1
          fi
          cp "$APK_PATH" "$RUNNER_TEMP/AgriRover-debug.apk"
          echo "path=$RUNNER_TEMP/AgriRover-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriRover-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
